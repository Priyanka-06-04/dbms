    <div class="container">
        <h1>Dropping a Procedure</h1>
        <p>To drop a procedure, DROP PROCEDURE statement is used. In order to drop a procedure, one must either own the procedure or have DROP ANY PROCEDURE system privilege.
           <h3> Syntax of DROP PROCEDURE statement </h3>
          <pre class="syt">  DROP PROCEDURE  < procedure_name >;</pre>
            <h3>Example:</h3>
        <div class="eg">DROP PROCEDURE PRI;</div>    
            
        </p>
    </div>
</body>
