<body>
    <div class="container">
        <h1>
            Dropping A TABLE
        </h1>
        <P>
            To drop a trigger, DROP TRIGGER statement is used. In order to drop a trigger, one must either own the trigger or have DROP ANY TRIGGER system privilege.
        </P>
        <H3>Syntax of DROP TRIGGER statement is as follows:</H3>
        <PRE class="syt"  >  DROP TRIGGER ‹trigger_name>;</PRE>
           <h3> Example:</h3>
          <pre class="eg">
              DROP TRIGGER T1;
            </pre>
    </div>
</body>
</html>
